<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="55%" stop-color="#12283b"/>
      <stop offset="100%" stop-color="#0a3d3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c9a7"/>
      <stop offset="100%" stop-color="#6a5acd"/>
    </linearGradient>
    <linearGradient id="swatch1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="swatch2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
    <linearGradient id="swatch3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#1a936f"/>
    </linearGradient>
    <linearGradient id="swatch4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6a5acd"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c9a7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00c9a7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6a5acd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6a5acd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- ambient glows -->
  <circle cx="960" cy="90" r="260" fill="url(#glow)"/>
  <circle cx="1050" cy="280" r="220" fill="url(#glow2)"/>

  <!-- faint grid / artboard texture -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- decorative artboard panel on right -->
  <rect x="760" y="40" width="380" height="280" rx="18" fill="#0b1b2b" opacity="0.45" stroke="#00c9a7" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- bezier curve illustration mimicking vector pen tool -->
  <path d="M 800 250 C 850 130 950 130 1000 220 C 1030 275 1080 260 1110 190"
        fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <!-- anchor points -->
  <circle cx="800" cy="250" r="7" fill="#0d1b2a" stroke="#00c9a7" stroke-width="3"/>
  <circle cx="900" cy="150" r="7" fill="#0d1b2a" stroke="#00c9a7" stroke-width="3"/>
  <circle cx="1000" cy="220" r="7" fill="#0d1b2a" stroke="#6a5acd" stroke-width="3"/>
  <circle cx="1110" cy="190" r="7" fill="#0d1b2a" stroke="#6a5acd" stroke-width="3"/>

  <!-- control handles -->
  <line x1="800" y1="250" x2="850" y2="185" stroke="#00c9a7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="900" y1="150" x2="950" y2="160" stroke="#00c9a7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="1000" y1="220" x2="1050" y2="270" stroke="#6a5acd" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="1110" y1="190" x2="1070" y2="150" stroke="#6a5acd" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- color swatch cluster (palette) -->
  <g>
    <circle cx="830" cy="90" r="16" fill="url(#swatch1)"/>
    <circle cx="865" cy="80" r="16" fill="url(#swatch2)"/>
    <circle cx="898" cy="95" r="16" fill="url(#swatch3)"/>
    <circle cx="928" cy="78" r="16" fill="url(#swatch4)"/>
  </g>

  <!-- angular corner accent shapes -->
  <polygon points="1140,0 1200,0 1200,60" fill="#00c9a7" opacity="0.18"/>
  <polygon points="1140,360 1200,360 1200,300" fill="#6a5acd" opacity="0.18"/>

  <!-- small pen-tool nib icon top-left of panel -->
  <path d="M780 60 L800 40 L810 50 L790 70 Z" fill="#00c9a7" opacity="0.8"/>
  <line x1="778" y1="72" x2="790" y2="62" stroke="#00c9a7" stroke-width="2"/>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="64" fill="#f4faf9">
    <tspan x="60" y="150" textLength="700" lengthAdjust="spacingAndGlyphs">CorelDRAW Full</tspan>
    <tspan x="60" y="228" textLength="560" lengthAdjust="spacingAndGlyphs">Version Download</tspan>
  </text>

  <!-- accent underline -->
  <rect x="62" y="248" width="220" height="6" rx="3" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="62" y="288" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#b9d9d2" opacity="0.92">
    <tspan x="62" y="288" textLength="820" lengthAdjust="spacingAndGlyphs">Skip manual setup — download and run the full CorelDRAW version instantly</tspan>
  </text>
</svg>